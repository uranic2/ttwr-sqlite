name: Build and release Windows bundles

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validate version and tag
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_REF.StartsWith('refs/tags/')) {
            ./scripts/validate-release.ps1 -Tag $env:RELEASE_TAG
          } else {
            ./scripts/validate-release.ps1
          }
          ./scripts/check-public-tree.ps1

      - name: Set up build JDK
        id: jdk
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
          architecture: x64

      - name: Set up Java 8 x32 for compatibility checks
        id: java32
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '8'
          java-package: jre
          architecture: x86

      - name: Set up bundled Java 25 x64
        id: runtime
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
          java-package: jre
          architecture: x64

      - name: Prepare pinned native compiler
        id: native
        run: |
          $zig = ./scripts/prepare-ci.ps1
          "zig=$zig" >> $env:GITHUB_OUTPUT

      - name: Build application and restart probe
        env:
          TTWR_JDK: ${{ steps.jdk.outputs.path }}
          TTWR_ZIG: ${{ steps.native.outputs.zig }}
        run: |
          ./scripts/build.ps1 -JdkHome $env:TTWR_JDK -Zig $env:TTWR_ZIG
          & $env:TTWR_ZIG cc -target x86-windows-gnu -Os '-Wl,--subsystem,windows' src/test/native/UpdateRestartProbe.c -o build/UpdateRestartProbe.exe
          if ($LASTEXITCODE -ne 0) { throw 'Restart probe compilation failed' }

      - name: Test Java 25 x64 and Java 8 x32
        env:
          TTWR_JDK: ${{ steps.jdk.outputs.path }}
          TTWR_JAVA32: ${{ steps.java32.outputs.path }}
        run: |
          ./scripts/test.ps1 -JdkHome $env:TTWR_JDK -Gui -RestartProbe build/UpdateRestartProbe.exe
          ./scripts/test.ps1 -JdkHome $env:TTWR_JDK -JavaExe (Join-Path $env:TTWR_JAVA32 'bin/java.exe') -Gui -RestartProbe build/UpdateRestartProbe.exe

      - name: Package and verify both bundles
        env:
          TTWR_RUNTIME: ${{ steps.runtime.outputs.path }}
          TTWR_JAVA32: ${{ steps.java32.outputs.path }}
        run: |
          ./scripts/package.ps1
          ./scripts/package.ps1 -RuntimeHome $env:TTWR_RUNTIME
          ./scripts/verify-packages.ps1 -Java32Home $env:TTWR_JAVA32

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-failure-diagnostics
          path: |
            build/tests/**/application.log
            build/tests/**/helper.log
            build/tests/**/lock-child.log
            build/tests/**/ttwr.err
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload checked release bundles
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-release-bundles
          path: |
            releases/*.zip
            releases/SHA256SUMS.txt
            releases/release-notes.md
          if-no-files-found: error
          retention-days: 14

  publish:
    concurrency:
      group: ttwr-sqlite-release-publication
      cancel-in-progress: false
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-release-bundles
          path: release-bundles
      - name: Test release retention policy
        run: python3 -m unittest discover -s src/test/python -p 'test_release_retention.py'
      - name: Publish verified GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/publish-release.py --tag "$RELEASE_TAG" --directory release-bundles

      - name: Keep the latest three stable releases and tags
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/prune-releases.py --published-tag "$RELEASE_TAG" --keep 3
